<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A journal-style daily planner for the family.">
<meta name="theme-color" content="#f1dde6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#170d14" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Day Book">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Devon's Day Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap">
<style>
:root{
  --ground:#f1dde6; --ground2:#e6c6d6;
  --cover:#6b1c46; --cover2:#45102d; --foil:#f4d3b6; --foil-dim:rgba(244,211,182,.5); --foil-soft:rgba(244,211,182,.82);
  --paper:#fffafc; --paper2:#f5e4ec; --ink:#2d1420; --muted:#7b5d6c; --line:#ecd2df;
  --accent:#c9265f; --soft:#fbe4ee; --jr:#1f6f78; --st:#a8641a;
  --ok:#2b8a5f; --warn:#b7791f; --bad:#b83a3a; --shadow:rgba(60,10,35,.30); --rib:#e8618c;
  --serif:'Fraunces',Georgia,'Times New Roman',serif; --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#170d14; --ground2:#221420; --cover:#7d2653; --cover2:#4d1232;
    --paper:#2a1a24; --paper2:#33212d; --ink:#f8e9f0; --muted:#c9a9b9; --line:#4a3240;
    --accent:#f06595; --soft:#3d2432; --jr:#6cc4cc; --st:#f0b56a;
    --ok:#6fcf9f; --warn:#f0b56a; --bad:#f08a8a; --shadow:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --ground:#170d14; --ground2:#221420; --cover:#7d2653; --cover2:#4d1232;
  --paper:#2a1a24; --paper2:#33212d; --ink:#f8e9f0; --muted:#c9a9b9; --line:#4a3240;
  --accent:#f06595; --soft:#3d2432; --jr:#6cc4cc; --st:#f0b56a;
  --ok:#6fcf9f; --warn:#f0b56a; --bad:#f08a8a; --shadow:rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--ground),var(--ground2));color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,blockquote{margin:0}
.app{height:100%;height:100dvh;max-width:520px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:10px}

/* ---------- book shell ---------- */
.bookwrap{flex:1;min-height:0;position:relative;margin-right:12px;perspective:2200px;perspective-origin:0% 50%}
.pages{position:absolute;inset:0;perspective:1800px;perspective-origin:0% 50%}
.page{position:absolute;inset:0;background:var(--paper);border-radius:4px 12px 12px 4px;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:inset 14px 0 16px -12px rgba(0,0,0,.28),3px 1px 0 var(--paper2),6px 2px 0 var(--line),9px 3px 0 var(--paper2),0 16px 34px var(--shadow)}
.pinner{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 18px 26px 26px}
.leaf{position:absolute;inset:0;transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden;z-index:5;pointer-events:none;
  transition:transform .85s cubic-bezier(.55,.1,.25,1)}
.leaf::after{content:"";position:absolute;inset:0;border-radius:4px 12px 12px 4px;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(30,0,15,.55));opacity:0;transition:opacity .85s ease}
.leaf.go{transform:rotateY(-172deg)}
.leaf.go::after{opacity:1}
.leaf.flipped{transform:rotateY(-172deg)}
.leaf.flipped::after{opacity:1}
.leaf.back{transform:none}

.cover{position:absolute;inset:0;z-index:6;transform-origin:left center;transform-style:preserve-3d;
  transition:transform 1.15s cubic-bezier(.6,.02,.2,1),visibility 0s}
.cover.open{transform:rotateY(-176deg);visibility:hidden;transition:transform 1.15s cubic-bezier(.6,.02,.2,1),visibility 0s 1.15s}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 14px 14px 6px}
.front{background:radial-gradient(120% 90% at 30% 10%,var(--cover),var(--cover2));color:var(--foil);padding:26px 24px 22px 34px;display:flex;flex-direction:column;cursor:pointer;
  box-shadow:3px 1px 0 var(--cover2),0 18px 36px var(--shadow)}
.front::before{content:"";position:absolute;inset:12px 12px 12px 22px;border:1px solid var(--foil-dim);border-radius:8px;pointer-events:none}
.front::after{content:"";position:absolute;left:0;top:0;bottom:0;width:30px;border-radius:6px 0 0 6px;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(255,255,255,.05) 14px,transparent);pointer-events:none}
.back{background:var(--paper2);transform:rotateY(180deg)}
.ribbon{position:absolute;right:34px;bottom:-16px;width:22px;height:36px;background:var(--rib);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);pointer-events:none}

.cv-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--foil)}
.cv-top span:last-child{letter-spacing:.06em;text-transform:none;font-size:14px;font-variant-numeric:tabular-nums}
.cv-mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:12px 0;min-height:0}
.cv-day{font-family:var(--serif);font-size:15px;color:var(--foil-soft)}
.cv-greet{font-family:var(--serif);font-weight:600;font-size:clamp(28px,8.4vw,40px);line-height:1.08;text-wrap:balance;color:var(--foil);text-shadow:0 1px 0 rgba(0,0,0,.35)}
.cv-quote{font-family:var(--serif);font-style:italic;font-size:clamp(17px,4.7vw,21px);line-height:1.38;color:#fbe3d0;text-wrap:pretty}
.cv-win{font-size:13px;color:var(--foil-soft);border-top:1px solid var(--foil-dim);padding-top:10px}
.cv-win b{color:var(--foil);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px;display:block;margin-bottom:2px}
.cv-foot{display:flex;flex-direction:column;gap:10px}
.cv-now{font-size:13px;color:var(--foil)}
.cv-now b{font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips small{font-size:12px;color:var(--foil-soft);margin-right:2px}
.cchip{border:1px solid var(--foil-dim);background:transparent;color:var(--foil);border-radius:999px;padding:0 12px;min-height:40px;font-size:13px;font-weight:500;cursor:pointer}
.cchip[aria-pressed=true]{background:var(--foil);color:var(--cover2);border-color:var(--foil);font-weight:700}
.openbtn{margin-top:2px;background:var(--foil);color:var(--cover2);border:0;border-radius:14px;min-height:52px;font-weight:700;font-size:16px;letter-spacing:.02em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.openbtn svg{width:20px;height:20px}

/* ---------- nav ---------- */
.nav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.nav[hidden]{display:none}
.nbtn{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 12px;line-height:1.15}
.nbtn small{font-weight:400;color:var(--muted);font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbtn:disabled{opacity:.4;cursor:default}
.nbtn.mid{min-width:96px;background:var(--soft);border-color:transparent}
.nbtn.go{background:var(--accent);color:var(--paper);border-color:transparent}
.nbtn.go small{color:inherit;opacity:.85}

/* ---------- page content ---------- */
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.eyebrow{white-space:nowrap;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.link{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;min-height:40px}
.baby{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.baby .bl{display:flex;align-items:center;padding:0 4px 0 11px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.baby button{background:none;border:0;padding:0 11px;min-height:36px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.baby button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.ptitle{position:relative;padding-right:0}
.time{font-size:13px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.02em}
h2.title{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.08;margin:2px 0 6px;text-wrap:balance}
.lede{color:var(--muted);font-size:15px;text-wrap:pretty}
.stamp{position:absolute;right:0;top:4px;transform:rotate(-9deg);border:2px solid var(--accent);color:var(--accent);border-radius:8px;padding:2px 12px;font-family:var(--serif);font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:15px;background:var(--paper);pointer-events:none}
.stamp.fresh{animation:stampIn .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes stampIn{from{transform:rotate(-9deg) scale(2.2);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}

.banner{border-radius:12px;padding:11px 13px;margin:14px 0 4px;background:var(--soft);font-size:14px;text-wrap:pretty}
.banner b{display:block;font-family:var(--serif);font-size:16px;margin-bottom:2px}
.banner button{margin-top:6px}
.quiet{border-radius:12px;padding:11px 13px;margin:14px 0 4px;background:var(--ink);color:var(--paper);font-size:14px}
.quiet b{font-family:var(--serif);font-size:16px;display:block;margin-bottom:6px}
.quiet p{margin-top:5px}
.quiet .no{opacity:.85;font-size:13px}
.quiet .who{margin-right:6px}
.quiet .win{margin-top:12px;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}
.quiet .win>b{font-size:15px;margin-bottom:2px}
.quiet .win em{font-style:normal;font-family:var(--sans);font-weight:400;font-size:12px;opacity:.85}
.quiet .it{border-bottom:0}
.quiet .chk{padding-block:8px}
.quiet .box{border:2px solid var(--paper)}
.quiet .chk[aria-pressed=true] .box{background:var(--paper)}
.quiet .chk[aria-pressed=true] .box::after{border-color:var(--ink)}
.quiet .txt{color:var(--paper)}
.quiet .chk[aria-pressed=true] .txt{color:var(--paper);opacity:.7}
.awakehint{font-size:13px;color:var(--muted);margin-top:12px}

.lane{margin-top:14px;border-top:1px solid var(--line)}
.lane>summary{display:flex;align-items:center;gap:10px;min-height:56px;cursor:pointer;list-style:none;padding:6px 0}
.lane>summary::-webkit-details-marker{display:none}
.lane .gist{flex:1;font-size:14px;color:var(--muted);line-height:1.3;text-wrap:pretty}
.lane .cnt{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);flex:none}
.lane .chev{width:10px;height:10px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);flex:none;margin:0 4px 3px 2px;transition:transform .2s}
.lane[open] .chev{transform:rotate(-135deg);margin-top:5px}
.mom{--c:var(--accent)} .jr{--c:var(--jr)} .st{--c:var(--st)}
.who{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;color:var(--paper);background:var(--c);flex:none;white-space:nowrap}
.it{display:flex;align-items:flex-start;gap:2px;border-bottom:1px dashed var(--line)}
.it:last-of-type{border-bottom:0}
.chk{flex:1;min-width:0;display:flex;gap:12px;text-align:left;background:none;border:0;padding:11px 2px;min-height:48px;cursor:pointer}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--c);margin-top:0;display:grid;place-items:center}
.chk[aria-pressed=true] .box{background:var(--c)}
.chk[aria-pressed=true] .box::after{content:"";width:6px;height:11px;border:solid var(--paper);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk[aria-pressed=true] .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.txt{font-size:15px;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.tm{display:inline-block;min-width:36px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-left:6px}
.opt{font-size:11px;color:var(--muted);margin-left:6px}
.hint{display:block;font-size:13px;color:var(--warn);margin-top:3px}
.star{flex:none;width:44px;height:48px;background:none;border:0;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.star svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.star[aria-pressed=true]{color:var(--accent)}
.star[aria-pressed=true] svg{fill:currentColor}
.note{border-radius:12px;background:var(--paper2);padding:11px 13px;font-size:14px;margin:6px 0 4px;text-wrap:pretty}
.note b{font-family:var(--serif);font-size:15px}
.free{font-size:13px;font-weight:700;color:var(--accent);margin:4px 0 2px}
.ft{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.ft div{border-radius:12px;background:var(--paper2);padding:9px 12px;font-size:15px;font-weight:500;line-height:1.25}
.ft span{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--st);margin-bottom:2px}
.ft div:only-child{grid-column:1/-1}
.tip{font-size:13px;color:var(--muted);margin:8px 0 2px;text-wrap:pretty}
.tip b{color:var(--ink)}
.stations{display:grid;gap:8px;margin:8px 0}
.stn{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stn.now{border-color:var(--st);background:var(--paper2)}
.stn h3{font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.stn h3 em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--st)}
.stn p{font-size:14px;color:var(--muted);margin-top:2px}
.stn button{margin-top:4px;background:none;border:0;color:var(--st);font-weight:700;font-size:13px;cursor:pointer;padding:6px 0;min-height:36px}
.add{display:flex;gap:8px;margin-top:8px;padding-bottom:6px}
.add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:0 12px;min-height:46px;font-size:16px}
.btn{border:0;border-radius:12px;min-height:46px;padding:0 16px;font-weight:700;font-size:14px;cursor:pointer;background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--paper)}
.btn.full{width:100%}

/* ---------- contents ---------- */
.card{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0}
.card h3{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:2px}
.card .sub{font-size:13px;color:var(--muted);margin-bottom:4px}
.go-row{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit}
.big .it .chk{padding-block:9px}
.pglink{background:none;border:0;color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;padding:8px 6px;min-height:44px;flex:none}
.toc{margin-top:14px;border-top:1px solid var(--line)}
.trow{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;min-height:58px;cursor:pointer;position:relative;color:var(--ink)}
.trow .tt{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2}
.trow .ttl{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.15}
.trow .sub{display:block;font-family:var(--sans);font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.trow .prog{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.trow.done .ttl,.trow.done .prog{color:var(--muted)}
.trow.done .prog{color:var(--ok)}
.trow.now{background:var(--soft)}
.trow.now .prog{margin-right:22px}
.trow.now::after{content:"";position:absolute;right:8px;top:0;width:14px;height:24px;background:var(--rib);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.seg button{flex:1;min-height:44px;background:none;border:0;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.muted{color:var(--muted);font-size:13px;margin-top:16px}

/* ---------- close the day + recap ---------- */
.q{margin-top:18px}
.q h3{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:8px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt-b{min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-weight:700;font-size:15px;cursor:pointer}
.opt-b[aria-pressed=true]{background:var(--accent);color:var(--paper);border-color:transparent}
.carry{border-bottom:1px dashed var(--line);padding:8px 0}
.carry p{font-size:15px;margin-bottom:6px}
.carry .opts{grid-template-columns:1fr 1fr}
.carry .opt-b{min-height:44px;font-size:13px}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px;font-size:16px;resize:vertical}
.closed{border-radius:14px;background:var(--soft);padding:14px;margin-top:18px}
.closed h3{font-family:var(--serif);font-size:20px;margin-bottom:4px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;margin-top:10px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar i{display:block;width:100%;background:var(--accent);opacity:.55;border-radius:6px 6px 2px 2px;min-height:3px}
.bar.today i{opacity:1}
.bar b{font-size:12px;color:var(--ink)}
.dots{display:flex;gap:6px;margin-top:8px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.rough{background:var(--bad)} .dot.okay{background:var(--warn)} .dot.good{background:var(--ok)}
.entry{border-bottom:1px dashed var(--line);padding:10px 0;font-size:15px}
.shh{font-family:var(--serif);font-size:19px;font-weight:600;margin:18px 0 4px}
.entry small{display:block;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:500;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.alertbar{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:60;background:var(--accent);color:var(--paper);border-radius:16px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.35);max-width:520px;margin:0 auto}
.alertbar[hidden]{display:none}
.alertbar.nudge{background:#b3361d;color:#fff}
.alertbar .alt b{display:block;font-family:var(--serif);font-size:18px;line-height:1.2}
.alertbar .alt span{display:block;font-size:14px;margin-top:3px;opacity:.95;text-wrap:pretty}
.alertbar .alb{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

R("tk-sp-skillet","Turkey and Sweet Potato Skillet","turkey","Ground turkey","Skillet",30,"Sweet potato",
["1.5 lb ground turkey","2 medium sweet potatoes, cut in 1/2 inch cubes","1 bell pepper, diced","1 onion, diced","2 tsp smoked paprika","1 tsp garlic powder","1 tsp cumin","5 oz baby spinach or chopped kale","1 tbsp olive oil","Salt and pepper"],
["Microwave the sweet potato cubes in a covered bowl with a splash of water for 4 minutes to jump start them.","Heat the oil in a big skillet. Cook the turkey with the spices for 6 to 8 minutes, breaking it up.","Add the onion, pepper and sweet potatoes. Cook 10 to 12 minutes, stirring now and then, until the potatoes are tender.","Fold in the greens for 2 minutes. Check that the turkey is 165°F."],
"Top with a fried egg for extra protein."),
R("tk-stuffed-peppers","Turkey and Rice Stuffed Peppers","turkey","Ground turkey","Bake",45,"Rice",
["4 large bell peppers, halved and seeded","1 lb ground turkey","1.5 cups cooked rice","1 can (15 oz) diced tomatoes","1 onion, diced","5 oz baby spinach","1 tsp Italian seasoning","1 cup shredded cheese","Salt and pepper"],
["Heat the oven to 400°F. Set the pepper halves cut side up in a baking dish.","Cook the turkey and onion in a skillet for 7 minutes. Stir in the tomatoes, spinach, Italian seasoning and rice.","Spoon the filling into the peppers. Cover with foil and bake 25 minutes.","Top with cheese, uncover, and bake 5 to 8 minutes more until melted. Turkey should read 165°F."],
"Chop the peppers and onion the night before or during a nap to save 10 minutes."),
R("tk-meatball-sheet","Turkey Meatball Sheet Pan","turkey","Ground turkey","Sheet pan",40,"Potato",
["1.5 lb ground turkey","1/2 cup breadcrumbs","1 egg","2 tsp garlic powder","1 tsp Italian seasoning","1 lb baby potatoes, halved","12 oz green beans, trimmed","2 tbsp olive oil","Salt and pepper"],
["Heat the oven to 425°F. Toss the potatoes with half the oil and salt on a sheet pan. Roast 10 minutes.","Mix the turkey, breadcrumbs, egg and seasonings. Roll into about 16 meatballs.","Push the potatoes over. Add the meatballs, and the green beans tossed in the rest of the oil.","Roast 20 to 22 minutes until the meatballs reach 165°F."],
"Sterling can help roll meatballs. Wash hands well afterward."),
R("tk-fried-rice","Teriyaki Turkey Fried Rice","turkey","Ground turkey","Skillet",25,"Rice",
["1.25 lb ground turkey","3 cups cooked rice, day old is best","1 bell pepper, diced","1 onion, diced","2 cups small broccoli florets","2 eggs","1/4 cup teriyaki or soy sauce","1 tbsp oil","2 cloves garlic, minced"],
["Heat the oil in a large skillet or wok. Cook the turkey 6 to 8 minutes until no pink is left.","Add the onion, pepper, broccoli and garlic. Cook 5 minutes.","Push everything to the side, scramble the eggs in the empty space, then mix together.","Add the rice and sauce. Stir for 4 minutes until hot."],
"Cold leftover rice makes the best fried rice. Cook extra on Sunday."),
R("tk-chili","Sweet Potato Turkey Chili","turkey","Ground turkey","Soup",40,"Sweet potato",
["1.5 lb ground turkey","1 large sweet potato, peeled and diced small","1 onion, diced","1 bell pepper, diced","1 can kidney beans, drained","1 can (28 oz) crushed tomatoes","2 cups chicken broth","2 tbsp chili powder","1 tsp cumin","3 cups chopped kale","Salt"],
["Brown the turkey with the onion and pepper in a large pot for 8 minutes.","Stir in the chili powder and cumin for 1 minute.","Add the tomatoes, broth, sweet potato and beans. Simmer covered 20 minutes until the potato is tender.","Stir in the kale for 3 minutes. Check that the turkey is 165°F."],
"Make a double batch and freeze half for a night with no time."),
R("tk-burgers","Turkey Burgers with Potato Wedges","turkey","Ground turkey","Handheld",35,"Potato",
["1.5 lb ground turkey","1 tsp garlic powder","1 tsp onion powder","1 tbsp Worcestershire sauce","5 burger buns","3 medium potatoes, cut in wedges","2 tbsp olive oil","Salad greens, tomato, onion slices","Salt and pepper"],
["Heat the oven to 425°F. Toss the wedges with oil and salt. Roast 30 to 35 minutes, flipping halfway.","Mix the turkey with the seasonings and Worcestershire. Form 5 patties and press a dent in the middle of each.","Cook in a skillet 5 to 6 minutes per side until 165°F.","Serve on buns with greens and tomato, with the wedges on the side."],
"Turkey burgers dry out fast. Pull them off the heat the moment they hit 165°F."),
R("tk-hash","Turkey and Potato Hash","turkey","Ground turkey","Skillet",30,"Potato",
["1.25 lb ground turkey","3 medium potatoes, diced small","1 bell pepper, diced","1 onion, diced","1 tsp smoked paprika","1 tsp garlic powder","5 oz baby kale or spinach","4 eggs, optional","2 tbsp oil","Salt and pepper"],
["Microwave the diced potatoes 4 minutes. Heat the oil in a large skillet and cook the potatoes 8 minutes until golden.","Add the onion and pepper. Push everything to one side.","Cook the turkey with the spices on the empty side for 7 minutes, then stir it all together.","Add the greens. Make four wells and crack in the eggs. Cover 4 minutes."],
"A good breakfast for dinner night. One pan, easy cleanup."),
R("gc-lettuce-wraps","Ground Chicken Lettuce Wraps with Rice","chicken","Ground chicken","Handheld",25,"Rice",
["1.5 lb ground chicken","1 onion, diced","1 bell pepper, diced","3 cloves garlic","3 tbsp soy sauce","1 tbsp honey","1 tbsp rice vinegar","1 tsp ginger","1 head butter lettuce","3 cups cooked rice","Shredded carrots"],
["Cook the chicken, onion and pepper in a skillet 8 to 10 minutes until no pink is left.","Add the garlic and ginger for 1 minute.","Stir in the soy sauce, honey and vinegar. Cook 2 minutes.","Spoon into lettuce leaves with rice and carrots on the side."],
"Serve the filling over rice for anyone who does not want the lettuce."),
R("gc-fajita-bowl","Ground Chicken Fajita Bowls","chicken","Ground chicken","Bowl",25,"Rice",
["1.5 lb ground chicken","2 bell peppers, sliced","1 large onion, sliced","2 tbsp fajita seasoning","1 lime","3 cups cooked rice","4 cups chopped romaine","Salsa and shredded cheese"],
["Cook the peppers and onion in a large skillet with a little oil for 6 minutes. Move to a plate.","Cook the chicken in the same pan for 8 to 10 minutes. Add the fajita seasoning and 1/4 cup water.","Stir the vegetables back in and squeeze in the lime.","Serve over rice with romaine, salsa and cheese."],
"Slice the peppers and onion on Sunday so this is a dump and cook night."),
R("gc-soup","Ground Chicken Meatball Soup with Greens","chicken","Ground chicken","Soup",40,"Rice",
["1.25 lb ground chicken","1/2 cup breadcrumbs","1 egg","1 tsp Italian seasoning","6 cups chicken broth","1 onion, diced","2 carrots, sliced","1/2 cup uncooked white rice","5 oz baby spinach","3 cloves garlic","Salt and pepper"],
["Mix the chicken, breadcrumbs, egg and seasoning. Roll into small meatballs, about 1 inch.","Bring the broth to a boil with the onion, carrots and garlic. Stir in the rice and simmer 10 minutes.","Drop in the meatballs. Simmer 10 to 12 minutes until they reach 165°F.","Stir in the spinach for 2 minutes."],
"A good rainy day or sick day meal. Small meatballs cook fast."),
R("gc-potato-skillet","Garlic Parmesan Chicken and Potato Skillet","chicken","Ground chicken","Skillet",35,"Potato",
["1.5 lb ground chicken","1.25 lb baby potatoes, quartered","4 cloves garlic","1/2 cup grated parmesan","1/2 cup chicken broth","5 oz baby spinach","1 tsp Italian seasoning","2 tbsp olive oil","Salt and pepper"],
["Microwave the potatoes 5 minutes. Heat the oil in a large skillet and brown the potatoes 8 minutes.","Push them aside and cook the chicken with the seasoning 8 minutes until no pink is left.","Add the garlic and broth. Simmer 3 minutes.","Stir in the spinach and parmesan until wilted and melted."],
"Cut the potatoes small. Big pieces will not finish in time."),
R("cb-fajita-sheet","Sheet Pan Chicken Fajitas with Rice","chicken","Chicken breast","Sheet pan",35,"Rice",
["1.75 lb chicken breast, sliced thin","3 bell peppers, sliced","1 large onion, sliced","2 tbsp olive oil","2 tbsp fajita seasoning","1 lime","3 cups cooked rice","4 cups chopped romaine","Tortillas, optional"],
["Heat the oven to 425°F. Toss the chicken, peppers and onion with the oil and seasoning on a sheet pan.","Roast 18 to 22 minutes, stirring once, until the chicken reaches 165°F.","Squeeze the lime over everything.","Serve over rice or in tortillas with romaine."],
"Thin slices cook fast. Thick pieces need 5 more minutes."),
R("cb-lemon-potatoes","Lemon Herb Chicken, Potatoes and Green Beans","chicken","Chicken breast","Sheet pan",40,"Potato",
["4 chicken breasts, sliced into thin cutlets","1.5 lb baby potatoes, halved","12 oz green beans, trimmed","3 tbsp olive oil","1 lemon","2 tsp Italian seasoning","1 tsp garlic powder","Salt and pepper"],
["Heat the oven to 425°F. Toss the potatoes with 1 tbsp oil and salt on a sheet pan. Roast 12 minutes.","Toss the chicken with the rest of the oil, the seasonings and the juice of half the lemon.","Add the chicken and green beans to the pan. Roast 15 to 18 minutes until the chicken hits 165°F.","Squeeze on the rest of the lemon."],
"Slice the breasts in half through the middle so they cook evenly."),
R("cb-stirfry","Chicken and Broccoli Stir-Fry","chicken","Chicken breast","Skillet",25,"Rice",
["1.5 lb chicken breast, cut in bite size pieces","4 cups broccoli florets","1 bell pepper, sliced","1 onion, sliced","1/3 cup soy sauce","2 tbsp honey","1 tbsp cornstarch","3 cloves garlic","1 tsp ginger","1 tbsp oil","3 cups cooked rice"],
["Whisk the soy sauce, honey, cornstarch, garlic, ginger and 1/2 cup water for the sauce.","Cook the chicken in the oil over medium high heat 6 minutes until golden.","Add the broccoli, pepper and onion with a splash of water. Cover 3 minutes.","Pour in the sauce. Stir 2 minutes until glossy. Serve over rice."],
"Frozen broccoli works. Add it straight from the bag."),
R("cb-burrito-bowl","Chicken Burrito Bowls","chicken","Chicken breast","Bowl",30,"Rice",
["1.5 lb chicken breast, diced","1 tbsp chili powder","1 tsp cumin","1 tsp paprika","1 can black beans, drained","1 bell pepper, diced","1 onion, diced","1 cup corn","3 cups cooked rice","4 cups chopped romaine","Salsa and avocado"],
["Toss the chicken with the spices. Cook in a large skillet with a little oil 7 to 8 minutes until 165°F.","Add the pepper, onion and corn. Cook 5 minutes.","Warm the beans in the microwave.","Build bowls: rice, chicken mix, beans, romaine, salsa and avocado."],
"A make ahead favorite. Pack leftovers for Jr's lunch the next day."),
R("cb-garlic-bites","Garlic Butter Chicken Bites with Potatoes and Spinach","chicken","Chicken breast","Skillet",30,"Potato",
["1.5 lb chicken breast, cubed","1.25 lb baby potatoes, quartered small","3 tbsp butter","4 cloves garlic","1 tsp paprika","1 tsp Italian seasoning","5 oz baby spinach","Salt and pepper"],
["Microwave the potatoes 5 minutes. Brown them in 1 tbsp butter in a large skillet 8 minutes. Move to a plate.","Season the chicken and cook it in the same pan 6 to 7 minutes until golden and 165°F.","Add the rest of the butter and the garlic. Stir 1 minute.","Return the potatoes, add the spinach, and toss until wilted."],
"Leftovers are great in a wrap."),
R("cb-bbq-sweet","BBQ Chicken Sweet Potato Boats","chicken","Chicken breast","Bake",35,"Sweet potato",
["4 medium sweet potatoes","1.5 lb chicken breast, cut in strips","3/4 cup BBQ sauce","1 onion, diced","1 bell pepper, diced","1 tbsp oil","12 oz broccoli florets","Salt and pepper"],
["Prick the sweet potatoes and microwave 8 to 10 minutes, turning once, until soft.","Cook the chicken, onion and pepper in the oil 8 to 10 minutes until the chicken is 165°F.","Stir in the BBQ sauce and warm through.","Microwave the broccoli 3 minutes. Split the potatoes, pile on the chicken, and serve with the broccoli."],
"Microwaving the sweet potatoes saves 40 minutes over the oven."),
R("cb-soup","Chicken and Rice Soup with Greens","chicken","Chicken breast","Soup",40,"Rice",
["1.5 lb chicken breast","8 cups chicken broth","1 onion, diced","3 carrots, sliced","3/4 cup uncooked white rice","3 cloves garlic","1 tsp thyme","5 oz baby spinach or chopped kale","Salt and pepper"],
["Bring the broth, onion, carrots, garlic and thyme to a boil. Add the whole chicken breasts and simmer 15 minutes.","Take the chicken out and shred it with two forks.","Add the rice to the pot and simmer 12 minutes.","Return the chicken, stir in the greens for 2 minutes, and season."],
"Freezes well. Portion leftovers into single servings."),
R("ct-sheet-sweet","Sheet Pan Chicken Thighs with Sweet Potatoes and Broccoli","chicken","Chicken thigh","Sheet pan",40,"Sweet potato",
["2 lb boneless skinless chicken thighs","2 large sweet potatoes, cut in 3/4 inch cubes","4 cups broccoli florets","3 tbsp olive oil","2 tsp smoked paprika","1 tsp garlic powder","1 tsp onion powder","Salt and pepper"],
["Heat the oven to 425°F. Toss the sweet potatoes with 1 tbsp oil and salt. Roast 10 minutes.","Toss the thighs with the spices and 1 tbsp oil. Toss the broccoli with the rest of the oil.","Add the thighs and broccoli to the pan. Roast 20 to 22 minutes until the chicken reaches 165°F.","Rest 5 minutes and serve."],
"Thighs stay juicy even if you get pulled away for the baby."),
R("ct-honey-garlic","Honey Garlic Chicken Thighs with Rice and Green Beans","chicken","Chicken thigh","Skillet",35,"Rice",
["2 lb boneless skinless chicken thighs, cut in pieces","1/4 cup soy sauce","3 tbsp honey","4 cloves garlic, minced","1 tbsp rice vinegar","1 tsp cornstarch","12 oz green beans, trimmed","1 tbsp oil","3 cups cooked rice"],
["Whisk the soy sauce, honey, garlic, vinegar and cornstarch.","Cook the chicken in the oil in a large skillet 8 minutes until golden.","Add the green beans and 1/4 cup water. Cover 4 minutes.","Pour in the sauce and simmer 3 minutes until sticky. Check for 165°F. Serve over rice."],
"Everyone eats this one. Make extra sauce for the rice."),
R("ct-curry","Coconut Curry Chicken Thighs with Rice and Spinach","chicken","Chicken thigh","Skillet",40,"Rice",
["2 lb boneless skinless chicken thighs, cut in pieces","1 can (13.5 oz) coconut milk","2 tbsp mild curry powder","1 onion, diced","1 bell pepper, diced","3 cloves garlic","1 tsp ginger","5 oz baby spinach","1 tbsp oil","3 cups cooked rice","Salt"],
["Cook the chicken in the oil 6 minutes until browned. Move to a plate.","Cook the onion and pepper 4 minutes. Add the garlic, ginger and curry powder for 1 minute.","Pour in the coconut milk and scrape the pan. Return the chicken. Simmer 15 minutes.","Stir in the spinach and check the chicken is 165°F. Serve over rice."],
"Use mild curry powder so Sterling will eat it."),
R("ct-greek-bowl","Greek Chicken Thigh Bowls","chicken","Chicken thigh","Bowl",35,"Rice",
["2 lb boneless skinless chicken thighs","3 tbsp olive oil","1 lemon","2 tsp dried oregano","3 cloves garlic","1 bell pepper, sliced","1 onion, sliced","3 cups cooked rice","5 oz baby spinach","Cucumber, plain yogurt or tzatziki"],
["Toss the thighs with the oil, lemon juice, oregano, garlic, salt and pepper. Let sit 10 minutes.","Cook the thighs in a large skillet 6 to 7 minutes per side until 165°F.","Cook the pepper and onion in the same pan 5 minutes.","Slice the chicken. Build bowls with rice, spinach, vegetables, cucumber and a spoon of yogurt."],
"Marinate in the morning if you can. The flavor is better."),
R("ct-smashed","Crispy Skillet Chicken Thighs with Smashed Potatoes and Greens","chicken","Chicken thigh","Skillet",45,"Potato",
["2 lb boneless skinless chicken thighs","1.5 lb baby potatoes","2 tbsp olive oil","4 cloves garlic","1 tsp paprika","5 oz kale or spinach","1 lemon","Salt and pepper"],
["Boil the potatoes in salted water 12 to 15 minutes until tender. Drain.","Season the thighs and cook in a large skillet with oil 6 to 7 minutes per side until 165°F. Move to a plate.","Smash the potatoes flat with the bottom of a glass. Cook in the same pan 4 minutes per side until crisp.","Add the garlic and greens for 2 minutes. Squeeze lemon over everything."],
"The longest recipe here. Save it for a weekend afternoon."),
R("gb-beef-broccoli","Ground Beef and Broccoli Rice Bowls","beef","Ground beef","Bowl",25,"Rice",
["1.5 lb ground beef","4 cups broccoli florets","1 onion, diced","1 bell pepper, diced","1/4 cup soy sauce","2 tbsp brown sugar or honey","3 cloves garlic","1 tsp ginger","1 tsp cornstarch","3 cups cooked rice"],
["Cook the beef and onion in a large skillet 8 minutes until browned. Drain extra fat.","Add the broccoli, pepper, garlic and ginger with a splash of water. Cover 4 minutes.","Stir the soy sauce, sugar and cornstarch with 1/4 cup water and pour it in. Simmer 2 minutes.","Serve over rice. Beef should read 160°F."],
"Jr can eat a double portion of rice on training days."),
R("gb-cheeseburger","Cheeseburger Potato Skillet","beef","Ground beef","Skillet",30,"Potato",
["1.5 lb ground beef","1.5 lb potatoes, diced 1/2 inch","1 onion, diced","1 bell pepper, diced","1 tbsp Worcestershire sauce","1 tsp garlic powder","1.5 cups shredded cheddar","Romaine or salad greens","Pickles, ketchup, mustard"],
["Microwave the potatoes 5 minutes. Brown them in a large oven safe skillet with oil 8 minutes.","Add the beef, onion and pepper. Cook 8 minutes, breaking up the beef. Drain extra fat.","Stir in the Worcestershire and garlic powder. Top with cheese, cover, and let melt 3 minutes.","Serve with a big salad and pickles on the side."],
"Tastes like a cheeseburger with no buns to buy."),
R("gb-taco-sweet","Beef Taco Stuffed Sweet Potatoes","beef","Ground beef","Bake",40,"Sweet potato",
["4 medium sweet potatoes","1.25 lb ground beef","2 tbsp taco seasoning","1 bell pepper, diced","1 onion, diced","1 can black beans, drained","1 cup shredded cheese","Shredded lettuce or baby spinach","Salsa"],
["Prick the sweet potatoes and microwave 8 to 10 minutes, turning once, until soft.","Cook the beef, onion and pepper 8 minutes. Add the taco seasoning and 1/3 cup water. Simmer 3 minutes.","Warm the beans.","Split the potatoes. Fill with beef, beans and cheese. Top with lettuce and salsa."],
"Let Sterling sprinkle the cheese."),
R("gb-korean","Korean-Style Ground Beef Bowls","beef","Ground beef","Bowl",25,"Rice",
["1.5 lb ground beef","1/4 cup soy sauce","3 tbsp brown sugar","1 tbsp sesame oil","4 cloves garlic","1 tsp ginger","6 oz baby spinach","1 cup shredded carrots","1 cucumber, sliced","3 cups cooked rice","Sesame seeds, optional"],
["Cook the beef in a large skillet 8 to 10 minutes until browned. Drain extra fat.","Stir together the soy sauce, sugar, sesame oil, garlic and ginger. Pour over the beef and simmer 3 minutes.","Wilt the spinach in the pan for 1 minute.","Serve over rice with carrots and cucumber."],
"Skip the red pepper flakes for the boys. Add them to your own bowl."),
R("gb-sloppy","Sloppy Joe Baked Potatoes","beef","Ground beef","Bake",40,"Potato",
["4 large russet potatoes","1.5 lb ground beef","1 onion, diced","1 bell pepper, diced","1 can (8 oz) tomato sauce","2 tbsp ketchup","1 tbsp brown sugar","1 tbsp mustard","1 tbsp Worcestershire sauce","12 oz broccoli or green beans"],
["Prick the potatoes and microwave 10 to 12 minutes, turning once, until soft.","Cook the beef, onion and pepper 8 minutes. Drain extra fat.","Stir in the tomato sauce, ketchup, sugar, mustard and Worcestershire. Simmer 8 minutes.","Steam the broccoli or beans 4 minutes. Split the potatoes and spoon the sloppy joe mix on top."],
"Beef should read 160°F. The potatoes keep it a real meal without buns."),
R("st-sheet","Steak and Potatoes Sheet Pan with Green Beans","steak","Steak","Sheet pan",35,"Potato",
["1.75 lb sirloin or flat iron steak, cut in 1 inch cubes","1.5 lb baby potatoes, halved","12 oz green beans, trimmed","3 tbsp olive oil","1 tsp garlic powder","1 tsp smoked paprika","2 tbsp butter","Salt and pepper"],
["Heat the oven to 425°F. Toss the potatoes with 1 tbsp oil and salt. Roast 15 minutes.","Toss the green beans and steak with the rest of the oil and the seasonings.","Add them to the pan. Roast 8 to 10 minutes for medium rare, 12 for medium.","Toss with the butter as it melts."],
"Dry the steak cubes with a paper towel so they brown instead of steam."),
R("st-fajita-bowl","Steak Fajita Rice Bowls","steak","Steak","Bowl",30,"Rice",
["1.5 lb skirt, flank or sirloin steak, sliced thin against the grain","2 bell peppers, sliced","1 large onion, sliced","2 tbsp fajita seasoning","1 lime","1 tbsp oil","3 cups cooked rice","4 cups chopped romaine","Salsa and guacamole"],
["Toss the steak with the fajita seasoning.","Heat a large skillet very hot with the oil. Cook the steak in two batches 2 to 3 minutes each. Move to a plate.","Cook the peppers and onion 6 minutes. Return the steak and squeeze in the lime.","Serve over rice with romaine, salsa and guacamole."],
"A hot pan matters more than anything. Do not crowd the steak."),
R("st-butter-bites","Garlic Butter Steak Bites with Rice and Broccoli","steak","Steak","Skillet",25,"Rice",
["1.5 lb sirloin steak, cut in 1 inch cubes","3 tbsp butter","4 cloves garlic","4 cups broccoli florets","1 tsp Italian seasoning","1 tbsp oil","3 cups cooked rice","Salt and pepper"],
["Steam or microwave the broccoli 3 minutes.","Heat the oil in a large skillet until very hot. Sear the seasoned steak in two batches, 2 minutes per side.","Lower the heat. Add the butter and garlic to the last batch and stir 1 minute.","Toss with the broccoli and serve over rice."],
"Ready in 25 minutes when the rice is already made."),
R("st-hash","Steak and Sweet Potato Hash with Kale","steak","Steak","Skillet",35,"Sweet potato",
["1.5 lb sirloin steak, cut in 1/2 inch cubes","2 medium sweet potatoes, diced small","1 bell pepper, diced","1 onion, diced","5 oz baby kale, chopped","1 tsp smoked paprika","1 tsp garlic powder","2 tbsp oil","Salt and pepper"],
["Microwave the sweet potatoes 4 minutes. Cook in the oil in a large skillet 8 minutes until browned.","Add the onion and pepper. Cook 4 minutes. Move everything to a plate.","Sear the seasoned steak in the pan 3 to 4 minutes.","Return the vegetables, add the kale, and stir 2 minutes."],
"Add fried eggs to make it a weekend brunch dinner."),
R("st-cheesesteak","Philly Cheesesteak Skillet over Rice","steak","Steak","Skillet",30,"Rice",
["1.5 lb thin sliced sirloin or ribeye","2 bell peppers, sliced","2 onions, sliced","1 tbsp Worcestershire sauce","1 tsp garlic powder","8 slices provolone","5 oz baby spinach","1 tbsp oil","3 cups cooked rice"],
["Cook the peppers and onions in the oil in a large skillet 8 minutes until soft. Move to a plate.","Cook the steak in the hot pan 3 to 4 minutes with the garlic powder and Worcestershire.","Return the vegetables and stir in the spinach.","Lay the cheese on top, cover 2 minutes to melt, and serve over rice."],
"Ask the butcher to slice the steak thin, or freeze it 20 minutes and slice it yourself."),

var PREP=["Cook a big pot of rice (3 cups dry) and keep it in the fridge for 4 days.","Roast a tray of sweet potatoes or potatoes to reheat all week.","Wash and chop peppers and onions, and keep them in a container.","Wash the greens and dry them. Spinach and kale keep 4 to 5 days.","Cook 2 pounds of one protein, plain, to use in bowls and wraps."];

var mealF={p:'all',s:'all',q:false},recOpen={},delArm=null;
var PROT=[['all','All'],['turkey','Turkey'],['chicken','Chicken'],['beef','Beef'],['steak','Steak'],['fav','Favorites']];
var STYLES=['all','Bowl','Skillet','Sheet pan','Bake','Soup','Handheld'];
function recipeById(id){for(var i=0;i<RECIPES.length;i++)if(RECIPES[i].id===id)return RECIPES[i];return null}
function recentDinners(n){var t=ymd(),k=Object.keys(S.days).filter(function(x){return x<t&&S.days[x].dinner}).sort().slice(-n);return k.map(function(x){return recipeById(S.days[x].dinner)}).filter(Boolean)}
function dayHash(){var d=new Date();return d.getFullYear()*372+d.getMonth()*31+d.getDate()}
function suggest(off){
  var x=ctxFor(ymd()),rec=recentDinners(4),ids=rec.map(function(r){return r.id}),last=rec.length?rec[rec.length-1]:null;
  var pool=RECIPES.filter(function(r){return (!x.wd||r.t<=40)&&ids.indexOf(r.id)<0&&(!last||(r.p!==last.p&&r.st!==last.st))});
  if(!pool.length)pool=RECIPES.slice();
  var w=[];pool.forEach(function(r){w.push(r);if(S.fav[r.id])w.push(r)});
  return w[(dayHash()*7+(off||0))%w.length]}
function tonight(){var d=D();if(d.dinner){var r=recipeById(d.dinner);if(r)return r}return suggest(d.sugOff||0)}
function metaLine(r){return r.t+' min · '+r.pl+' · '+r.st+' · '+r.c}
function varietyNudge(){
  var rec=recentDinners(4);if(rec.length<3)return '';
  var cs={},cp={};rec.forEach(function(r){cs[r.st]=(cs[r.st]||0)+1;cp[r.pl]=(cp[r.pl]||0)+1});
  var st=Object.keys(cs).filter(function(k){return cs[k]>=3})[0],pp=Object.keys(cp).filter(function(k){return cp[k]>=3})[0];
  if(st)return 'Three or more of your last four dinners were '+(st==='Bowl'?'bowls':st.toLowerCase()+' meals')+'. Try a different style tonight.';
  if(pp)return 'Lots of '+pp.toLowerCase()+' lately. A different protein might feel fresh.';
  return ''}
function recipeHTML(r){
  var fav=!!S.fav[r.id],open=!!recOpen[r.id];
  var h='<details class="rec" data-k="'+r.id+'" id="rec_'+r.id+'"'+(open?' open':'')+'><summary><span class="rn">'+esc(r.n)+'</span><span class="rm">'+esc(metaLine(r))+(fav?' · Favorite':'')+'</span></summary><div class="rbody">';
  h+='<h4>Ingredients</h4><ul>'+r.ing.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul>';
  h+='<h4>Steps</h4><ol>'+r.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>';
  if(r.tip)h+='<p class="rtip"><b>Tip:</b> '+esc(r.tip)+'</p>';
  h+='<div class="acts"><button class="btn primary" data-a="mlock" data-id="'+r.id+'">Make this tonight</button><button class="btn" data-a="mgroc" data-id="'+r.id+'">Add to grocery list</button><button class="btn" data-a="mfav" data-id="'+r.id+'">'+(fav?'Remove favorite':'Favorite')+'</button></div></div></details>';
  return h}
function grocHTML(){
  var g=S.groc,open=!!recOpen.groc,n=g.filter(function(x){return !x.done}).length;
  var h='<details class="rec" data-k="groc" id="rec_groc"'+(open?' open':'')+'><summary><span class="rn">Grocery list</span><span class="rm">'+(g.length?n+' to buy'+(g.length-n?', '+(g.length-n)+' in the cart':''):'Empty. Add a recipe, or type an item.')+'</span></summary><div class="rbody">';
  g.forEach(function(x){h+='<div class="it mom"><button class="chk" data-a="gtog" data-id="'+x.id+'" aria-pressed="'+(!!x.done)+'"><span class="box"></span><span class="txt">'+esc(x.t)+'</span></button></div>'});
  h+='<div class="add"><input id="gin" type="text" placeholder="Add an item" aria-label="Add a grocery item"><button class="btn" data-a="gadd">Add</button></div>';
  if(g.length)h+='<div class="acts"><button class="btn" data-a="gclr">Remove checked</button><button class="btn" data-a="gall">Clear all</button></div>';

var feedBusy=false;
function feedLoad(force){
  if(feedBusy||!window.fetch)return;
  var now=Date.now();if(!force&&now-(S.feed.fetched||0)<30*60000)return;
  feedBusy=true;
  var urls=[];if(S.feed.url)urls.push(S.feed.url);urls.push('leads.json');
  var gh=location.hostname.match(/^([^.]+)\.github\.io$/),seg=location.pathname.split('/')[1];
  if(gh){var repo=(seg&&seg.indexOf('.')<0)?seg:gh[1]+'.github.io';['main','master'].forEach(function(br){urls.push('https://raw.githubusercontent.com/'+gh[1]+'/'+repo+'/'+br+'/leads.json')})}
  var best=null,i=0;
  (function next(){
    if(i>=urls.length){
      feedBusy=false;S.feed.fetched=now;
      if(best){S.feed.items=best.items||[];S.feed.updated=best.updated||'';S.feed.sources=best.sources||[];S.feed.status='ok'}

    fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){if(j&&j.items&&(!best||(j.updated||'')>(best.updated||'')))best=j;next()},function(){next()})
  })()}

var GLOSS=[
['UGC (user generated content)','Videos, photos or reviews made by a regular person instead of the brand itself. Brands pay creators like you to make it, then use it as ads and on their own pages.'],
['UGC creator','A person paid to make this kind of content. You do not need a big following. Brands hire you for how natural the video looks, not for your follower count.'],
['Influencer','Someone who posts to their own audience, and the brand pays for access to that audience. UGC is different: you make the content, and the brand posts it on its own accounts.'],
['Brand / client','The company paying you.'],
['Brief (creative brief)','The instructions from the brand: what the product is, who it is for, what to say, what to show, and how long the video should be. Read it twice before you film.'],
['Deliverables','The exact things you promise to hand over, such as "2 videos, 20 seconds each, plus 3 photos."'],
['Usage rights / licensing','Permission for the brand to use your video. It says where (their Instagram, their ads, their website), for how long, and whether they can run it as a paid ad. This is separate from your fee for making the video, and it is where much of the extra money is.'],
['Organic usage','The brand posts your video on its own page for free, with no ad money behind it.'],
['Paid usage / paid ads','The brand puts ad money behind your video so more strangers see it. Brands expect to pay more for this.'],
['Whitelisting / partnership ads / Spark Ads','The brand runs ads that appear to come from your account, using your handle. It looks more real to viewers, so brands pay extra for it. Spark Ads is TikTok\'s version. It is a monthly add-on and you can say no.'],
['Perpetual / perpetuity','Forever, with no end date. Brands like it and it should cost a lot more. Be careful with "perpetual usage" for a small fee.'],
['Exclusivity','You agree not to make content for the brand\'s direct competitors for a set time. It limits your income, so it should cost extra.'],
['Raw footage','The original, uncut clips before editing. Brands sometimes ask for it so their editor can re-cut it. Charge extra.'],
['Hook','The first 1 to 3 seconds of the video. Its only job is to stop someone from scrolling.'],
['CTA (call to action)','What you tell the viewer to do at the end, such as "tap the link to try it."'],
['B-roll','Extra footage that shows the product or the scene while you talk or while a voice plays: close-ups, hands using it, the packaging.'],
['Talking head','A video where you speak straight to the camera.'],
['Voiceover (VO)','Your voice recorded over footage of the product. You do not have to appear on camera.'],
['Hands-only','A video that shows only your hands using the product. No face needed.'],
['Unboxing','Opening a package on camera and reacting to what is inside.'],
['First impressions','Trying a product for the first time on camera and saying what you notice.'],
['Testimonial','You talking about how a product worked for you in real life.'],
['Problem and solution','A video that shows a problem in the first seconds, then the product fixing it.'],
['Demo','A video showing how the product works, step by step.'],
['Short-form video','Vertical video of about 6 to 60 seconds, made for TikTok, Instagram Reels and YouTube Shorts.'],
['Evergreen','Content that stays useful for a long time and can be reused.'],
['Revisions','Rounds of changes the brand asks for after seeing your video. Your agreement should say how many are included, usually one or two. Extra rounds cost extra.'],
['Approval window','A set time (like 3 business days) for the brand to approve or ask for changes. After that, the video counts as approved.'],
['Rush fee','An extra charge when the brand needs the video faster than normal.'],
['Kill fee','Money you keep if the brand cancels after you started the work.'],
['Deposit','A part of the payment paid before you start.'],
['Net 15 / Net 30','Payment terms. The brand pays within 15 or 30 days after you deliver or after the invoice.'],
['Invoice','A simple bill you send: what you did, the amount, the due date, and how to pay you.'],
['Retainer','A monthly agreement where a brand pays you a set amount for a set amount of content every month. This is steadier money than one-off jobs.'],
['Bundle / package','A discounted price for several videos at once, such as 3 videos for less than 3 separate ones.'],
['Gifted / product-for-content','The brand sends you free product instead of money. Fine to build samples, but it is not a paid job. Do not accept it for work that will run as an ad.'],
['Affiliate / commission','You earn a percentage when someone buys through your link. It can be extra on top of a fee. On its own, it is a gamble.'],
['Base rate','Your price for the video itself, before usage rights and add-ons.'],
['Add-ons','Extras priced on top of the base rate, such as paid ad usage, raw footage, extra hooks, a script, or rush delivery.'],
['Hook variations','Several versions of the same video with different openings so the brand can test which works best. Priced per version.'],
['Cut-downs','Shorter versions of a longer video, such as a 15 second version of a 30 second video.'],
['Marketplace','A website or app that connects brands and creators, such as Billo, JoinBrands or Insense. They set the process and often the price.'],
['Job board','A page of listings you apply to, such as Pitchlo.'],
['Cold pitch / cold DM','Messaging a brand that has not asked for anything yet. Short, specific, and polite.'],
['Media kit / one-page portfolio','One page or link with your samples, your rates, and how to reach you.'],
['Sample / spec video','A video you made on your own to show your skill. Always label it as a personal sample.'],
['Meta Ad Library','A free public tool from Meta (Facebook and Instagram) that shows every ad a brand is running right now.'],
['TikTok Creative Center','A free TikTok tool that shows top performing ads and trends by industry.'],
['Scope creep','When a brand slowly asks for more than you agreed to. Fix it by pointing to the deliverables in writing.'],
['FTC disclosure','The rule that you must clearly say when content is paid or gifted, such as #ad or the platform\'s paid partnership tag.'],
['W-9','A form you give a US company so it has your tax information to pay you. It is normal and safe to send to a real brand. Never send it to someone who has not agreed to hire you.'],
['1099','A tax form a US company may send you in January showing what it paid you. Ask a tax professional how to handle it.'],
['NDA','A non-disclosure agreement. A promise not to share private details, such as an unreleased product.'],
['Exclusive license vs. non-exclusive license','Exclusive means only that brand can use the video. Non-exclusive means you could also license it to others. Most UGC is non-exclusive unless you agree otherwise.'],
['ROI / conversion','How many viewers bought after watching. Brands care about this, so you should too.'],
['TikTok Shop','TikTok\'s built-in store. Brands there often hire creators for product videos and sometimes live sessions.']];

var SCH=[
{id:'s1',t:'Start here: what UGC is and how you earn',m:'In plain words',h:`<p><b>UGC</b> stands for user generated content. A company wants a video that looks like a real person using its product, not a TV commercial. You make that video on your phone. The company pays you and then posts your video on its own accounts, or runs it as an ad.</p>
<p>That is the whole job. You are not an "influencer." You do not need followers. The brand gets your video, and your audience size does not matter.</p>
<p><b>How you get paid:</b> a fee per video, sometimes extra for letting the brand run it as a paid ad, sometimes free product on top, and sometimes a monthly retainer if a brand keeps coming back.</p>
<p><b>What a normal job looks like:</b> you apply or pitch, the brand says yes, you agree on the details in writing, you film one or two short videos at home, the brand asks for small changes if needed, you send the final video, and you get paid.</p>
<p><b>Why it suits your life:</b> it can be done in short sessions at home, around naps and feeds. Many jobs need only your hands or your voice. You choose which jobs to take.</p>`},
{id:'s2',t:'The words you will hear',m:'About 55 terms, in layman\'s terms',h:'GLOSSARY'},
{id:'s3',t:'What to charge: 2026 going into 2027',m:'Real number ranges and a quote calculator',h:'RATES'},
{id:'s4',t:'Your edge: being a mom',m:'Niche brands look for',h:`<p>Brands that sell to parents want content from parents. That is real, steady demand. Categories where a mom of three looks natural:</p>
<ul><li>Baby and toddler products, feeding, sleep, and travel gear</li><li>Postpartum and nursing products, including comfort and wellness items</li><li>Kids' snacks, lunch boxes, clothing, and toys</li><li>Cleaning, laundry, kitchen and organizing products</li><li>Family meals, meal prep, and grocery items</li><li>Skincare, haircare and wellness for busy women</li><li>Home and decor products, and anything that saves time</li></ul>
<p>Say it in your pitch: "mom of three" tells a brand you understand the buyer. Use products you already use. Real use looks better on camera than anything staged.</p>
<p>Note on rates: none of the 2026 rate guides we reviewed gave a separate price for parenting content. Do not accept the low end just because you are new. Quote from your own rate card once you have 3 samples.</p>`},
{id:'s5',t:'Filming around kids and feeds',m:'Short sessions that fit your day',h:`<p>You do not need a free afternoon. Treat each video as a 10 to 15 minute job.</p>
<ul><li><b>Choose a filming window.</b> Nap time, right after a feed when the baby is settled, or after bedtime. Pick the same window each day so it becomes a habit.</li><li><b>Batch.</b> Film 2 or 3 videos in the same session with the same lighting spot. Edit later in small pieces.</li><li><b>Use a spot near a window.</b> Daylight does most of the work. Sit or stand facing the light, not with it behind you.</li><li><b>Hands-only and voiceover are easier.</b> No makeup, no outfit, no face needed. Record the voiceover later, even in the car, with the phone close to your mouth.</li><li><b>Keep the phone steady.</b> A cheap phone stand or a stack of books works.</li><li><b>Write the script on a sticky note,</b> or use the daily rep drill, so you are never starting from a blank page.</li><li><b>Use feeding time for the thinking parts,</b> like reading a brief, sending a pitch, or checking the leads list. You can do that with one hand.</li></ul>
<p>One short video a day beats one long session a month. That is also why the daily plan in this book is small.</p>`},
{id:'s6',t:'Make your first samples',m:'Shot lists, hooks and what to film',h:`<p>Brands hire from samples. Make 3 to 6 short videos using products you already own. Say they are personal samples. One of each style covers most jobs.</p>
<p><b>The five styles brands buy most</b></p>
<ul><li><b>Demo:</b> show how it works in steps.</li><li><b>Problem and solution:</b> show the problem in 3 seconds, then the product fixing it.</li><li><b>First impressions or unboxing:</b> open it, react, say what you notice first.</li><li><b>Testimonial:</b> talk to the camera for 20 seconds about why you use it.</li><li><b>Hands-only or voiceover:</b> no face, just the product and your voice.</li></ul>
<p><b>A simple shot list for any product (5 shots):</b> wide shot of the product in your home, hands opening or using it, close-up of the detail, your reaction, the result.</p>
<p><b>Hook lines you can borrow (first 2 seconds):</b></p>
<ul><li>"I did not expect this to work, but..."</li><li>"If you have [a problem], stop scrolling."</li><li>"Three kids, no time. This is the one thing I kept using."</li><li>"I tried [product] so you do not have to."</li><li>"The [thing] I wish I had found sooner."</li></ul>
<p><b>Simple script shape (20 to 30 seconds):</b> hook (2 sec), the problem (5 sec), the product in action (10 sec), one honest benefit (5 sec), a call to action (3 sec).</p>
<p>Make the same video with 3 different openings. Brands love variations, and you can sell them.</p>`},
{id:'s7',t:'Where the work is',m:'Marketplaces, job boards, direct pitches',h:`<p>Use two active channels and one passive one.</p>
<p><b>Marketplaces and apps (apply to briefs):</b> Billo (free app, intro video, paid twice a month by PayPal), JoinBrands (new briefs daily, fixed rates from about $60 a video), Trend (iPhone app, US only, new partnerships daily), Insense (wants a portfolio and about 1,000 Instagram followers or 500 median TikTok views), Cohley, Collabstr. Marketplaces usually pay less than direct work, but they are the fastest way to get your first paid jobs, reviews and real samples.</p>
<p><b>Job boards:</b> Pitchlo lists hundreds of open UGC jobs and says it updates daily. That is the main source behind your Fresh leads list.</p>
<p><b>Direct pitching:</b> find brands that already run creator-style ads, using the Meta Ad Library and TikTok Creative Center, and message them. This pays the most. Reply rates are low (about 5 to 10 percent of cold messages get answered), so send steadily.</p>
<p><b>Communities:</b> r/UGCcreators on Reddit (about 98,000 members) and Facebook groups like UGC Brand Deals and UGC Creators Community. Good for real rates and spotting scams.</p>
<p>How long until money? There is no promise. Early on, treat your first 20 applications as practice.</p>`},
{id:'s8',t:'How to apply and pitch, step by step',m:'The process from lead to sent',h:`<ol><li><b>Open the lead.</b> Read the whole listing. Note the pay, the number of videos, how long they want, and what the product is.</li><li><b>Check it is real.</b> Look for a brand name, a website, and clear terms. Skip anything that asks you to pay.</li><li><b>Pick your best matching sample</b> and have its link ready.</li><li><b>Copy a pitch</b> from the Fresh leads card or the message scripts, and fill in the brackets.</li><li><b>Add one specific idea</b> for their product. One sentence is enough.</li><li><b>Send it,</b> then tap "I applied" so it is logged and counts toward your points.</li><li><b>Follow up</b> once after 3 to 5 days and once after about 10 days. Then move on.</li></ol>
<p>Aim for quality: a few tailored messages work better than many copied ones. If you hear nothing, it tells you nothing about your talent.</p>`},
{id:'s9',t:'Message scripts you can copy',m:'16 ready-to-send messages',h:'SCRIPTS'},
{id:'s10',t:'Reading a brief and doing the job',m:'From yes to delivered',h:`<ol><li><b>Read the brief twice.</b> Underline the must-haves: product points to mention, words to avoid, length, and the call to action.</li><li><b>Confirm in writing</b> the deliverables, usage, fee, revisions, and deadline (script 6 above).</li><li><b>Plan your shots</b> with the 5 shot list.</li><li><b>Film more than you need.</b> Two or three takes of the opening.</li><li><b>Edit simply:</b> trim dead air, add captions, export vertical.</li><li><b>Check the brief again</b> before you send. Did you say what they asked? Is the length right?</li><li><b>Deliver early</b> with a friendly note. Brands remember creators who are on time.</li><li><b>Send an invoice</b> as soon as they approve.</li></ol>`},
{id:'s11',t:'Contracts, usage rights and getting paid',m:'What to check before you say yes',h:`<p>This is general information, not legal or tax advice.</p>
<p><b>Check these 8 things in writing before you film:</b></p>
<ol><li><b>Usage:</b> which channels (organic or paid ads), how long, and whether your name, face or voice can appear in ads.</li><li><b>Deliverables:</b> exactly what you will hand over.</li><li><b>Revisions:</b> how many are included, and a time limit for the brand to respond.</li><li><b>Payment:</b> the amount, due date, and what happens if they cancel.</li><li><b>Ownership vs. license:</b> you normally keep ownership and give a license to use it.</li><li><b>Exclusivity:</b> which competitors, and for how long. It costs extra.</li><li><b>Termination:</b> who can end the deal and what is owed.</li><li><b>Files:</b> whether they get raw footage and whether they can re-edit.</li></ol>
<p><b>What the 2026 data says:</b> in a 2026 Aspire survey, 77 percent of brands said they reuse creator content in paid ads, and 67 percent put paid use in the creator\'s first contract or rate. A 30 day window is becoming the starting point for usage, with higher prices for longer, multi-platform or exclusive rights.</p>
<p><b>Getting paid:</b> ask for a deposit on bigger jobs, send an invoice, and write the due date on it. Marketplaces hold payment and release it after approval. If a brand sends a W-9 or asks for one, that is normal after they agree to hire you. Keep records of what you earn, because US businesses may send a 1099 and you may owe tax. Ask a tax professional how to set that up.</p>
<p><b>Disclose paid content.</b> Use #ad or the platform\'s paid partnership tag on anything you post that was paid or gifted.</p>`},
{id:'s12',t:'Red flags and common mistakes',m:'How to avoid the bad ones',h:`<p><b>Walk away from:</b></p>
<ul><li>Anyone who asks you to pay to join, pay to be considered, or buy a "course" to get the job.</li><li>"Perpetual" or "buyout" usage for a small flat fee.</li><li>No written terms, or terms that keep changing.</li><li>Free product only, for content that will run as an ad.</li><li>A rush to start before the price is agreed.</li><li>Products you must buy with no written promise to reimburse you.</li></ul>
<p><b>Common beginner mistakes:</b></p>
<ul><li>Not asking for usage terms and giving away paid-ad rights for free.</li><li>Quoting one flat price that does not change with scope.</li><li>Waiting for the perfect sample instead of making a good one.</li><li>Sending the same message to everyone.</li><li>Giving up after 5 applications.</li><li>Forgetting to log it. The log is how you see which sources work.</li></ul>`},
{id:'s13',t:'2027: what is changing',m:'Demand, AI, usage rights, retainers',h:`<p>Most of these are predictions from companies that sell UGC tools, so treat them as direction, not promises.</p>
<ul><li><b>Demand:</b> brands keep shifting money to creators. An IAB report cited by Verified Market Research puts US creator ad spend near $37 billion in 2025 and about $44 billion forecast for 2026.</li><li><b>Usage rights are getting more formal:</b> expect shorter default windows (30 days), monthly pricing, and written permission for ads that use your handle. Paid-ad use is increasingly expected, so price it.</li><li><b>AI:</b> brands use AI for scripts, edits and testing, and platforms are labeling AI-made content. Real people showing real use stay valuable. A standard usage license does not let a brand train AI on your video, so keep that in your contract.</li><li><b>Retainers:</b> long-term partnerships keep replacing one-off jobs. Creators who deliver on time and communicate well get renewed.</li><li><b>Formats:</b> the first 1 to 2 seconds matter more every year. Hooks, variations, and clear stories win.</li><li><b>Skills to build:</b> hooks, simple editing, reading a brief, quoting usage, and keeping proof of results.</li></ul>`},
{id:'s14',t:'Growing: bundles, retainers and referrals',m:'From one video to steady income',h:`<ol><li><b>Sell bundles.</b> Three videos for 10 to 25 percent less than three single ones is a common offer.</li><li><b>Offer hook variations.</b> Same video, different openings, priced per version.</li><li><b>Pitch a monthly package</b> after one or two good jobs (script 16). Retainers reported in 2026 guides range from about $375 to $2,200 a month for smaller brands, and higher for bigger scopes.</li><li><b>Ask for a testimonial and a referral</b> after every good job (script 15).</li><li><b>Keep your Brand Book current.</b> It is your list of who to contact again.</li><li><b>Then build your group.</b> Your log, your lessons and your leads list are what a paid group is made of.</li></ol>`}];

  h+='<h4>Add-ons on top of the base rate</h4>'+RATE_ADDONS.map(function(r){return '<p style="margin:6px 0"><b>'+r[0]+':</b> '+r[1]+'</p>'}).join('');

  h+='<h4>Going into 2027</h4><p style="margin:6px 0">Nothing we reviewed forecast specific 2027 prices. The direction: brands want paid-ad rights more often, usage is priced by the month, retainers are growing, and AI tools are pushing down prices for simple generic videos. Real, specific, trustworthy content holds its value.</p>';
  h+='<h4>Quote calculator</h4><div class="form"><label for="cq_base">Your base price for the video ($)</label><input id="cq_base" type="number" inputmode="numeric" value="150"><label for="cq_use">Usage</label><select id="cq_use"><option value="0">Organic only on the brand\'s own pages (3 months)</option><option value="30">Paid ads, 30 days</option><option value="50">Paid ads, 90 days</option><option value="75">Paid ads, 6 months</option><option value="125">Forever (perpetual)</option></select><label for="cq_wl">Whitelisting (ads from your handle)</label><select id="cq_wl"><option value="0">No</option><option value="1">1 month</option><option value="3">3 months</option></select><label for="cq_hk">Extra hook versions</label><input id="cq_hk" type="number" inputmode="numeric" value="0"><label for="cq_ex">Exclusivity</label><select id="cq_ex"><option value="0">None</option><option value="20">Short, one product type</option><option value="40">Longer or broader</option></select><label><input type="checkbox" id="cq_raw"> Include raw footage</label><label><input type="checkbox" id="cq_rush"> Rush delivery</label><label><input type="checkbox" id="cq_scr"> I write the script</label><button class="btn primary full" style="margin-top:12px" data-a="calcgo">Work out my quote</button><div id="calcOut"></div></div>';

function calcRun(){
  var g=function(id){var e=document.getElementById(id);return e?e.value:''},c=function(id){var e=document.getElementById(id);return !!(e&&e.checked)};
  var base=Math.max(0,Math.round(+g('cq_base')||0)),lines=[['Video',base]],tot=base;
  var use=+g('cq_use')||0;if(use){var a=Math.round(base*use/100);lines.push(['Paid ad usage ('+g('cq_use')+'% of base)',a]);tot+=a}
  var wl=+g('cq_wl')||0;if(wl){var w=Math.round(base*.3*wl);lines.push(['Whitelisting, '+wl+' month'+(wl>1?'s':'')+' (about 30% of base per month)',w]);tot+=w}
  var hk=Math.max(0,Math.round(+g('cq_hk')||0));if(hk){lines.push([hk+' extra hook version'+(hk>1?'s':'')+' at $75',hk*75]);tot+=hk*75}
  var ex=+g('cq_ex')||0;if(ex){var e=Math.round(base*ex/100);lines.push(['Exclusivity ('+ex+'% of base)',e]);tot+=e}
  if(c('cq_raw')){var r=Math.round(base*.4);lines.push(['Raw footage (about 40% of base)',r]);tot+=r}
  if(c('cq_scr')){lines.push(['Script writing',175]);tot+=175}
  if(c('cq_rush')){var u=Math.round(tot*.35);lines.push(['Rush delivery (about 35% of the total)',u]);tot+=u}
  calcTxt='My quote:\n'+lines.map(function(l){return '- '+l[0]+': $'+np(l[1])}).join('\n')+'\nTotal: $'+np(tot)+'\nIncludes 1 to 2 rounds of revisions. Payment due within 15 days of delivery.';
  var out=document.getElementById('calcOut');
  if(out)out.innerHTML='<div class="card" style="margin-top:12px"><h3>Total: $'+np(tot)+'</h3>'+lines.map(function(l){return '<p class="sub" style="color:var(--ink);margin:4px 0">'+esc(l[0])+': <b>$'+np(l[1])+'</b></p>'}).join('')+'<p class="sub">These percentages are the middle of the ranges above. Adjust to fit the job.</p><button class="btn full" data-a="calccopy">Copy this quote</button></div>'}

function scoreToday(chs,d){
  var tot=0,done=0,on=0,late=0,m=nowMin(),missed=[],jrT=0,jrD=0,stT=0,stD=0;
  chs.forEach(function(c){
    if(c.id==='close')return;
    c.mom.forEach(function(it){
      if(it.opt)return;tot++;
      if(d.done[it.id]){done++;var at=d.doneAt&&d.doneAt[it.id];if(at==null||at<=c.t[1]+15)on++;else late++}
      else if(m>=c.t[1])missed.push(it.t);
    });
    c.jr.forEach(function(it){if(it.opt)return;jrT++;if(d.done[it.id])jrD++});
    c.st.forEach(function(it){if(it.opt)return;stT++;if(d.done[it.id])stD++});
  });
  return {tot:tot,done:done,on:on,late:late,missed:missed,jrT:jrT,jrD:jrD,stT:stT,stD:stD}}
function alStreak(){

  if(dd&&dd.closed&&good(dd))n++;
  for(var i=0;i<60;i++){if(!good(S.days[k]))break;n++;k=addD(k,-1)}
  return n}

function jrBlocks(type){

function makeLeaf(html,y){
  var l=document.createElement('div');l.className='leaf';l.setAttribute('aria-hidden','true');
  l.innerHTML='<div class="page"><div class="pinner">'+html+'</div></div>';return l;
}
function go(to){
  var ord=order();to=Math.max(0,Math.min(ord.length-1,to));
  if(to===cur||busy)return;
  var dir=to>cur?1:-1;
  if(!MOTION){cur=to;draw();return}
  busy=true;var host=pagesEl,leaf;
  if(dir>0){
    leaf=makeLeaf(pinner.innerHTML);host.appendChild(leaf);leaf.querySelector('.pinner').scrollTop=pinner.scrollTop;
    cur=to;draw();
    void leaf.offsetWidth;leaf.classList.add('go');
    setTimeout(function(){leaf.remove();busy=false},DUR);
  }else{
    leaf=makeLeaf(pageHTML(ord[to]));leaf.classList.add('flipped');host.appendChild(leaf);
    void leaf.offsetWidth;leaf.classList.remove('flipped');leaf.classList.add('back');
    setTimeout(function(){cur=to;draw();leaf.remove();busy=false},DUR);
  }
}
